[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcsel-lib"   # pip/conda sees this
version = "3.1.0"
description = "Functions to Simulate VCSEL Array Dynamics"
requires-python = ">=3.10"
authors = [{ name = "Max Chumley" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "IPython>=8.10",
    "jupyter>=1.0",
    "scipy>=1.10",
    "joblib>=1.3",
    "tqdm>=4.66",
    "latex>=0.7.0",
    "setproctitle>=1.3"
]

[project.optional-dependencies]
rl = [
    "torch>=2.1",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools]
py-modules = ["vcsel_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
